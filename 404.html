<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · Zion Web</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--fondo:#F5F9F6;--tinta:#0B1A12;--verde:#0A8F4E;--gris:#4A5E52}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--fondo);color:var(--tinta);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
h1{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.15;margin-bottom:.6rem}
p{color:var(--gris);max-width:34rem;margin:0 auto 1.6rem}
a{display:inline-block;padding:.85rem 1.4rem;border-radius:999px;background:var(--tinta);color:#fff;text-decoration:none;font-weight:600}
a:focus-visible{outline:3px solid var(--verde);outline-offset:3px}
.idioma{display:inline-flex;align-items:center;min-height:36px;padding:3px;border-radius:999px;border:1.5px solid #D7E5DC;background:#fff;font:700 .75rem/1 system-ui;letter-spacing:.04em;cursor:pointer;color:var(--gris)}.idioma span{padding:6px 9px;border-radius:999px}.idioma span.on{background:var(--tinta);color:#fff}.top{position:fixed;top:16px;right:16px}
</style>
<script src="/i18n-en.js" defer></script>
<script src="/i18n.js" defer></script>
</head>
<body>
<div class="top" data-idioma></div>
<main>
<h1>Esta página no existe</h1>
<p>Puede que el enlace esté mal escrito o que la página ya no esté. Desde el inicio puedes ver precios y pedir tu muestra gratis.</p>
<a href="/">Ir al inicio de Zion Web</a>
</main>
</body>
</html>
